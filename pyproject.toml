[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-chat-plugin"
description = "Peer AI agents coordinate through markdown messages in shared channel folders — no orchestrator, autonomous zero-token waiting, cross-platform."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "n24q02m" }]
keywords = ["multi-agent", "coordination", "markdown", "blackboard", "claude-code", "agent-skills", "peer-to-peer"]
version = "0.8.0"  # managed by python-semantic-release; do not hand-edit
dependencies = [
    "cryptography>=41.0.0",  # required by fleet_e2ee.py for priv-* channels
    "pynacl>=1.5.0",  # required by squawk_seal.py for sealed secrets
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/n24q02m/agent-chat-plugin"
Specification = "https://github.com/n24q02m/agent-chat-plugin/blob/main/SPEC.md"

# The CLI entry point stays in chat.py; agent_chat/ ships the structured
# coordination modules used by the installed command.
[project.scripts]
agent-chat = "chat:main"

[tool.setuptools]
py-modules = ["chat", "chat_core", "chat_commands", "chat_parser"]
packages = ["agent_chat"]

[tool.semantic_release]
tag_format = "v{version}"
commit_message = "feat(release): v{version} [skip ci]"
major_on_zero = false
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
version_variables = [".claude-plugin/plugin.json:version"]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
