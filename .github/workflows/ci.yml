name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Pinned to the same version .pre-commit-config.yaml uses. Unpinned, a ruff
      # release that widens the default rule set turns main red with no code
      # change (0.16.0 did exactly that), and CI disagrees with the local hook.
      - run: pip install ruff==0.15.7
      - run: ruff check .
      - name: install project package
        run: python -m pip install .
      - name: protocol and state tests
        # -t . makes `tests` a package so tests/__init__.py provisions
        # throwaway fleet identity keys (FLEET_KEYS_DIR) before any test
        # module runs -- the audit path signs events and fails closed
        # without key material, which CI runners don't have.
        run: python -m unittest discover -s tests -t . -p "test_*.py" -v
      - name: byte-compile
        run: python -m py_compile chat.py squawk_seal.py hooks/session_inbox.py
      - name: smoke test CLI
        run: python chat.py --help
      - name: sealed-secret selftest
        run: python squawk_seal.py selftest

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: python
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
