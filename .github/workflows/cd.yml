name: CD

# Release + PyPI publish. Runs on the built-in GITHUB_TOKEN
# (contents: write): main has no branch protection and no rulesets, so no
# GitHub App token is needed to push the version commit/tag. PyPI publish
# uses Trusted Publishing (OIDC), no token secret.
#
# NOTE: an earlier revision of this workflow required a foreign GitHub App
# (n24q02m-ci, repo var CI_APP_ID + secret CI_APP_KEY) that was never
# installed in this org -- it failed every run. It is gone; nothing to set up.
# The sync-marketplace job was also removed: it dispatched to
# n24q02m/claude-plugins, a foreign org's repo (toxicwind/claude-plugins
# does not exist), so it could never work as written.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options: [beta, stable]

env:
# Release lane: merge to main auto-publishes stable; beta only via manual dispatch (release_type=beta).
  # workflow_dispatch keeps release_type as an explicit override.
  RELEASE_TYPE: ${{ github.event_name == 'push' && 'stable' || inputs.release_type }}

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: n24q02m/better-semantic-release@988ab15eed114d3943a43d60d9fdc5fbf071fea3 # v1.6.2
        id: release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: python-semantic-release/publish-action@6d89e2de8d40ecb3717316ecbbf15a6fa8ea9039 # v10.6.2
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

  publish-pypi:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv build
      - name: Publish to PyPI (Trusted Publishing / OIDC)
        run: uv publish --trusted-publishing always
